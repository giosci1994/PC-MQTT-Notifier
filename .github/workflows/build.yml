name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon=icon.ico --add-data "icon.png;." --add-data "locales;locales" --name "PC-MQTT-Notifier" main.py
          
      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss

      - name: SHA256SUMS.txt and VERIFY.ps1
        shell: pwsh
        run: |
          Get-ChildItem Output -Filter *.exe | Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -Path Output/SHA256SUMS.txt -Encoding ascii
          Copy-Item scripts/VERIFY.ps1 Output/VERIFY.ps1
          Get-Content Output/SHA256SUMS.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-MQTT-Notifier-Setup
          path: |
            Output/*.exe
            Output/SHA256SUMS.txt
            Output/VERIFY.ps1

      - name: Upload Installer to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            Output/*.exe
            Output/SHA256SUMS.txt
            Output/VERIFY.ps1
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
